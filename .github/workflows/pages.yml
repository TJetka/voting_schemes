name: Validate and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_PATH: ${{ vars.BASE_PATH || '/voting_schemes/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install locked browser dependencies
        run: npm ci
      - name: Install data validation tools
        run: python -m pip install uv==0.9.5
      - run: uv sync --locked
      - run: uv run pytest -q tests/python
      - run: uv run ruff check scripts tests/python
      - run: uv run ruff format --check scripts tests/python
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Install headless Chromium and system libraries
        timeout-minutes: 10
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser acceptance under repository subpath
        run: npm run test:e2e
      - name: Build for deployment destination
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
