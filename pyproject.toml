[project]
name = "laboratorium-koalicji-data"
version = "0.1.0"
description = "Reproducible official PKW data import and validation (browser app uses npm)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]
addopts = "-q"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

